name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Update Lotto Data"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # workflow_run으로 트리거된 경우, 데이터 갱신 워크플로우가 성공했을 때만 배포한다
    # (데이터 수집 실패로 graceful하게 종료된 실행까지 매번 재배포할 필요는 없지만,
    # 그 경우도 job 자체는 success로 끝나므로 결과적으로 큰 차이는 없다 — 실패한
    # workflow_run에 대해서만 명시적으로 배포를 건너뛴다).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # GitHub Pages가 Jekyll로 out/을 처리하면서 _next 등 밑줄로 시작하는
      # 폴더를 무시하는 걸 방지한다.
      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
