name: Update Lotto Data

on:
  schedule:
    # 매주 토요일 21:30 KST(=UTC 12:30). 로또 추첨은 21:00 KST경 진행되므로
    # 미러 사이트(smok95/lotto)가 갱신될 시간을 30분 정도 남겨둔다.
    - cron: "30 12 * * 6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-lotto-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # 동행복권 공식 API는 이 프로젝트가 접근 가능한 환경(GitHub Actions 러너 포함
      # 가능성)에서 IP/세션 단위로 차단된 이력이 있어(scripts/fetch-draws.ts 상단 주석
      # 참고), 커뮤니티 미러를 사용한다. 미러 요청이 실패해도 워크플로우 자체는
      # 실패시키지 않고 기존 데이터를 그대로 유지한다 (요구사항: graceful fallback).
      - name: Fetch latest draw data
        id: fetch
        continue-on-error: true
        run: npm run fetch-draws

      - name: Log fetch failure (data kept as-is)
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::warning::데이터 수집 실패 — 기존 data/draws.json을 그대로 유지합니다. 다음 예약 실행이나 수동 재실행(workflow_dispatch)에서 다시 시도됩니다."

      - name: Regenerate statistics and backtest
        if: steps.fetch.outcome == 'success'
        run: npm run generate-stats

      - name: Run test suite
        if: steps.fetch.outcome == 'success'
        run: npm test

      - name: Verify production build
        if: steps.fetch.outcome == 'success'
        run: npm run build

      - name: Commit and push if changed
        id: commit
        if: steps.fetch.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ public/data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "새로운 회차 데이터가 없습니다 (미러가 아직 갱신 전일 수 있음)."
          else
            git commit -m "chore: update lotto draw data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
